name: ROBOSCOPIA Data Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Audit and test data quality tools
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run automated tests
        run: node --test tests/*.test.mjs

      - name: Compile local parser adapters
        run: python -m py_compile adapters/docling_adapter.py adapters/opendataloader_adapter.py

      - name: Validate empty parser benchmark safely
        run: node scripts/parser-benchmark.mjs data/parser-benchmark-corpus.json "$RUNNER_TEMP/parser-benchmark-report.json"

      - name: Run data quality audit
        run: node scripts/data-quality-audit.mjs --json

      - name: Generate review queue
        run: node scripts/data-quality-review-queue.mjs --json

      - name: Generate source verification report
        run: node scripts/source-verification-engine.mjs --json > data/source-verification-report.json

      - name: Generate evidence matching review report
        run: node scripts/evidence-matching-review-engine.mjs --json

      - name: Run automated evidence verification gate
        run: node scripts/run-automated-verification.mjs --json > "$RUNNER_TEMP/automated-verification-report.json"

      - name: Validate evidence extraction CLI
        run: node scripts/technical-evidence-extraction-engine.mjs --help

      - name: Validate evidence document acquisition CLI
        run: node scripts/evidence-document-acquisition.mjs --help
