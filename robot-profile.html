reen)}.meta{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.pill{border:1px solid var(--line);border-radius:99px;padding:5px 10px;color:#afc4d8;font-size:10px}.section{margin:18px 0 22px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#0d2033,#091827);padding:22px}.section h2{font-size:19px;margin:0 0 15px;letter-spacing:-.02em}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.section-head h2{margin:0}.hint{color:#829bb4;font-size:10px}.gallery{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}.media-photo{width:100%;height:100%;max-height:260px;object-fit:contain;border-radius:10px;background:#081522}.media-credit{display:block;font-size:10px;margin-top:8px;color:#9bb1c8}.media{min-height:140px;border:1px dashed #365672;border-radius:11px;background:linear-gradient(145deg,#132e47,#0a1929);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14px;color:#a8bfd4}.media:first-child{min-height:210px}.media b{font-size:12px;color:#dcefff}.media small{font-size:10px;margin-top:5px;color:#809bb5}.media a{font-size:11px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.spec{background:#071624;border:1px solid #203d56;border-radius:9px;padding:12px;min-width:0}.spec b{display:block;font-size:20px;letter-spacing:-.03em;overflow-wrap:anywhere}.spec span{display:block;color:#9bb1c8;font-size:11px}.spec a{display:inline-block;font-size:10px;margin-top:8px;text-decoration:none}.list{display:grid;gap:9px;margin:0;padding:0;list-style:none}.list li{padding:10px 12px;border:1px solid #203d56;background:#091a2a;border-radius:8px;color:#b8cadd;font-size:12px}.list li:before{content:"—";color:var(--cyan);margin-right:9px}.sources{display:grid;gap:9px}.source{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:11px 13px;border:1px solid #203d56;border-radius:8px;background:#091a2a;font-size:12px}.source a{text-decoration:none}.source small{color:#8098b0;font-size:10px}.notice{color:#a8bbce;font-size:11px;border-left:2px solid var(--gold);padding:8px 12px;background:#d6b66b0a}footer{padding:28px 0 42px;color:#718ba5;font-size:10px;border-top:1px solid #ffffff15;margin-top:32px}

<script> (async()=>{ const id=new URLSearchParams(location.search).get("id");let lang="en",records=[]; const tr=(en,sr)=>lang==="en"?en:sr; const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); const safeHttps=value=>{try{const u=new URL(String(value??""),location.href);return u.protocol==="https:"?u.href:""}catch{return ""}}; try{const res=await fetch("data/robots.json");if(!res.ok)throw Error("data unavailable");records=(await res.json()).records}catch(e){document.getElementById("app").textContent="The dossier data could not be loaded. Please return to the Knowledge Base.";return} const r=records.find(x=>x.id===id);if(!r){document.getElementById("app").innerHTML='<section class="section"><h2>Profile not found</h2><a href="knowledge-base.html">Return to Knowledge Base</a></section>';return} const label={quadruped:["Quadruped robot","Četvoronožni robot"],humanoid:["Humanoid robot","Humanoidni robot"],cobot:["Collaborative robot","Kolaborativni robot"],industrial:["Industrial robot arm","Industrijska robotska ruka"]}; function render(){document.documentElement.lang=lang;document.title=r.model+" — ROBOSCOPIA technical dossier";document.getElementById("crumbname").textContent=r.model; const apps=r.applications.map(x=>"<li>"+esc(x)+"</li>").join("");const strengths=r.strengths.map(x=>"<li>"+esc(x)+"</li>").join("");const limits=r.limitations.map(x=>"<li>"+esc(x)+"</li>").join(""); const specs=r.specifications.map(s=>'<div class="spec"><b>'+esc(s.value)+(s.unit?" "+esc(s.unit):"")+'</b><span>'+esc(s.name)+'</span>'+(s.qualifier?'<span>'+esc(s.qualifier)+'</span>':"")+'<a href="'+esc(s.source)+'" target="_blank" rel="noopener noreferrer">'+tr("Evidence ↗","Izvor podatka ↗")+'</a></div>').join(""); const sources=r.sources.map(s=>'<div class="source"><span>'+esc(s.label)+'</span><a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+tr("Open source ↗","Otvori izvor ↗")+'</a></div>').join(""); const photos=(Array.isArray(r.media)?r.media:[]).map(photo=>{const r2Photo=photo&&photo.assetKey&&window.RoboscopiaMedia?window.RoboscopiaMedia.resolve(photo.assetKey):null;const url=safeHttps(r2Photo||(photo&&photo.url));return url?{photo,url,sourceUrl:safeHttps(photo.sourceUrl)}:null}).filter(Boolean);
const media=photos.length?photos.map(({photo,url,sourceUrl},index)=>('<div class="media"><a class="roboscopia-gallery-link" href="'+esc(url)+'" data-pswp-width="'+(Number(photo.width)>0?Math.round(Number(photo.width)):1600)+'" data-pswp-height="'+(Number(photo.height)>0?Math.round(Number(photo.height)):1200)+'"><img class="media-photo" src="'+esc(url)+'" alt="'+esc(photo.alt||r.manufacturer+" "+r.model+" — "+(index+1))+'" loading="lazy" decoding="async" referrerpolicy="no-referrer"></a><b>'+tr("Product image","Fotografija proizvoda")+'</b><small>'+esc(photo.note)+'</small>'+(sourceUrl?'<a class="media-credit" href="'+esc(sourceUrl)+'" target="_blank" rel="noopener noreferrer">'+tr("Image source: ","Izvor fotografije: ")+esc(photo.source||"Source")+' ↗</a>':'')+'</div>')).join("")+('<div class="media"><b>'+tr("Additional angles","Dodatni uglovi")+'</b><small>'+tr("More manufacturer views will be added after source and reuse-rights review","Dodatni prikazi proizvođača biće dodati nakon provere izvora i prava korišćenja")+'</small></div>')+('<div class="media"><b>'+tr("Video demonstration","Video-demonstracija")+'</b><small>'+tr("Official video link to be added after review","Zvanični video biće dodat nakon provere")+'</small></div>') : '<div class="media"><b>'+tr("Product photograph unavailable","Fotografija proizvoda nije dostupna")+'</b></div>'; document.getElementById("app").innerHTML='<section class="hero"><div><div class="eyebrow">'+tr("Robotics intelligence / technical dossier","Robotika / tehnički dosije")+'</div><h1>'+esc(r.model)+'</h1><div class="sub">'+esc(lang==="sr"?(r.summarySr||r.summary):r.summary)+'</div><div class="meta"><span class="pill">'+esc(r.manufacturer)+'</span><span class="pill">'+esc(tr(...label[r.category]))+'</span><span class="pill">'+esc(r.variant)+'</span></div><span class="status">'+tr("Source-linked profile · verification pending","Profil sa povezanim izvorima · provera u toku")+'</span></div><div class="hero-art"><strong>'+esc(r.manufacturer.toUpperCase())+'<br><br>'+esc(r.model.toUpperCase())+'<br><small style="font-size:9px;color:#8daec8">'+tr("PRODUCT VISUALS PENDING RIGHTS REVIEW","FOTOGRAFIJE ČEKAJU PROVERU PRAVA")+'</small></strong></div></section> <section class="section"><div class="section-head"><h2>'+tr("Product gallery & demonstration","Galerija proizvoda i demonstracija")+'</h2><span class="hint">'+tr("Media rights status: ","Status prava za medije: ")+esc(r.mediaStatus)+'</span></div><div class="gallery roboscopia-gallery">'+media+'</div></section> <section class="section"><div class="section-head"><h2>'+tr("Technical specifications","Tehničke specifikacije")+'</h2><span class="hint">'+tr("Each value links to its source","Svaka vrednost vodi do izvora")+'</span></div><div class="specs">'+specs+'</div></section> <div class="grid"><section class="section"><h2>'+tr("Typical applications","Tipične primene")+'</h2><ul class="list">'+apps+'</ul></section><section class="section"><h2>'+tr("Strengths","Prednosti")+'</h2><ul class="list">'+strengths+'</ul></section></div> <section class="section"><h2>'+tr("Limitations & engineering notes","Ograničenja i tehničke napomene")+'</h2><ul class="list">'+limits+'</ul></section> <section class="section"><div class="section-head"><h2>'+tr("Manufacturer documentation & sources","Dokumentacija proizvođača i izvori")+'</h2><span class="hint">'+tr("Primary sources prioritized","Prednost imaju primarni izvori")+'</span></div><div class="sources">'+sources+'</div></section> <section class="section"><h2>'+tr("Model identity & development history","Identitet modela i istorija razvoja")+'</h2><div class="grid"><div class="spec"><span>'+tr("Manufacturer","Proizvođač")+'</span><b style="font-size:16px">'+esc(r.manufacturer)+'</b></div><div class="spec"><span>'+tr("Family / generation","Porodica / generacija")+'</span><b style="font-size:16px">'+esc(r.generation||r.family||"Not confirmed")+'</b></div><div class="spec"><span>'+tr("Introduction year","Godina predstavljanja")+'</span><b style="font-size:16px">'+esc(r.introducedYear||tr("Not yet verified","Još nije potvrđena"))+'</b></div><div class="spec"><span>'+tr("Exact variant","Tačna varijanta")+'</span><b style="font-size:14px">'+esc(r.variant)+'</b></div></div><p class="notice">'+tr("Historical dates and availability are intentionally left blank until confirmed by reliable dated sources. Product images and video are not embedded until reuse rights are documented.","Istorijski datumi i dostupnost ostaju prazni dok se ne potvrde pouzdanim izvorima sa datumom. Fotografije i video se ne ugrađuju dok se ne dokumentuju prava korišćenja.")+'</p></section> <section class="section"><h2>'+tr("Competitive comparison","Poređenje sa konkurentskim modelima")+'</h2><p class="sub">'+tr("The comparison workspace is being connected to normalized model data. We will compare only equivalent specifications, variants and operating conditions.","Prostor za poređenje povezujemo sa standardizovanim podacima modela. Poredićemo samo ekvivalentne specifikacije, varijante i uslove rada.")+'</p><a class="btn" href="knowledge-base.html">'+tr("Browse models to compare","Pregledaj modele za poređenje")+'</a></section>'; import("./media-gallery.js").then(({init})=>init()).catch(()=>{}); } document.getElementById("lang").addEventListener("click",()=>{lang=lang==="en"?"sr":"en";document.getElementById("back").textContent=tr("← Knowledge Base","← Baza znanja");document.getElementById("crumbkb").textContent=tr("Knowledge Base","Baza znanja");render()});render(); })(); </script></body></html>
