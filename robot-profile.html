reen)}.meta{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.pill{border:1px solid var(--line);border-radius:99px;padding:5px 10px;color:#afc4d8;font-size:10px}.section{margin:18px 0 22px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#0d2033,#091827);padding:22px}.section h2{font-size:19px;margin:0 0 15px;letter-spacing:-.02em}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.section-head h2{margin:0}.hint{color:#829bb4;font-size:10px}.gallery{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}.media-photo{width:100%;height:100%;max-height:260px;object-fit:contain;border-radius:10px;background:#081522}.media-credit{display:block;font-size:10px;margin-top:8px;color:#9bb1c8}.media{min-height:140px;border:1px dashed #365672;border-radius:11px;background:linear-gradient(145deg,#132e47,#0a1929);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14px;color:#a8bfd4}.media:first-child{min-height:210px}.media b{font-size:12px;color:#dcefff}.media small{font-size:10px;margin-top:5px;color:#809bb5}.media a{font-size:11px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.spec{background:#071624;border:1px solid #203d56;border-radius:9px;padding:12px;min-width:0}.spec b{display:block;font-size:20px;letter-spacing:-.03em;overflow-wrap:anywhere}.spec span{display:block;color:#9bb1c8;font-size:11px}.spec a{display:inline-block;font-size:10px;margin-top:8px;text-decoration:none}.list{display:grid;gap:9px;margin:0;padding:0;list-style:none}.list li{padding:10px 12px;border:1px solid #203d56;background:#091a2a;border-radius:8px;color:#b8cadd;font-size:12px}.list li:before{content:"—";color:var(--cyan);margin-right:9px}.sources{display:grid;gap:9px}.source{display:flex;justify-content:space-between;gap:14px;align-items:cente <script> (async()=>{ const id=new URLSearchParams(location.search).get("id");let lang="en",records=[]; const tr=(en,sr)=>lang==="en"?en:sr; const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); try{const res=await fetch("data/robots.json");if(!res.ok)throw Error("data unavailable");records=(await res.json()).records}catch(e){document.getElementById("app").textContent="The dossier data could not be loaded. Please return to the Knowledge Base.";return} const r=records.find(x=>x.id===id);if(!r){document.getElementById("app").innerHTML='<section class="section"><h2>Profile not found</h2><a href="knowledge-base.html">Return to Knowledge Base</a></section>';return} const label={quadruped:["Quadruped robot","Četvoronožni robot"],humanoid:["Humanoid robot","Humanoidni robot"],cobot:["Collaborative robot","Kolaborativni robot"],industrial:["Industrial robot arm","Industrijska robotska ruka"]}; function render(){document.documentElement.lang=lang;document.title=r.model+" — ROBOSCOPIA technical dossier";document.getElementById("crumbname").textContent=r.model; const apps=r.applications.map(x=>"<li>"+esc(x)+"</li>").join("");const strengths=r.strengths.map(x=>"<li>"+esc(x)+"</li>").join("");const limits=r.limitations.map(x=>"<li>"+esc(x)+"</li>").join(""); const specs=r.specifications.map(s=>'<div class="spec"><b>'+esc(s.value)+(s.unit?" "+esc(s.unit):"")+'</b><span>'+esc(s.name)+'</span>'+(s.qualifier?'<span>'+esc(s.qualifier)+'</span>':"")+'<a href="'+esc(s.source)+'" target="_blank" rel="noopener noreferrer">'+tr("Evidence ↗","Izvor podatka ↗")+'</a></div>').join(""); const sources=r.sources.map(s=>'<div class="source"><span>'+esc(s.label)+'</span><a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+tr("Open source ↗","Otvori izvor ↗")+'</a></div>').join(""); const photo=r.media&&r.media[0];
const r2Photo=photo&&photo.assetKey&&window.RoboscopiaMedia?window.RoboscopiaMedia.resolve(photo.assetKey):null;
const photoUrl=r2Photo||(photo&&photo.url);
const media=photo?('<div class="media"><img class="media-photo" src="'+esc(photoUrl)+'" alt="'+esc(r.manufacturer+" "+r.model)+'" loading="lazy" decoding="async" referrerpolicy="no-referrer"><b>'+tr("Product image","Fotografija proizvoda")+'</b><small>'+esc(photo.note)+'</small><a class="media-credit" href="'+esc(photo.sourceUrl)+'" target="_blank" rel="noopener noreferrer">'+tr("Image source: ","Izvor fotografije: ")+esc(photo.source)+' ↗</a></div>')+('<div class="media"><b>'+tr("Additional angles","Dodatni uglovi")+'</b><small>'+tr("More manufacturer views will be added after source and reuse-rights review","Dodatni prikazi proizvođača biće dodati nakon provere izvora i prava korišćenja")+'</small></div>')+('<div class="media"><b>'+tr("Video demonstration","Video-demonstracija")+'</b><small>'+tr("Official video link to be added after review","Zvanični video biće dodat nakon provere")+'</small></div>') : '<div class="media"><b>'+tr("Product photograph unavailable","Fotografija proizvoda nije dostupna")+'</b></div>';
